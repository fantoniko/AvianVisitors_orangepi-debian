name: Publish web deploy branch

on:
  push:
    branches:
      - orange-pi-zero-3-debian
    paths:
      - avian/**
      - platforms/split-web-host/docker/**
      - portainer-compose.yaml
      - .github/workflows/publish-web-deploy.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-web-deploy
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish app initializer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platforms/split-web-host/docker/app.Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/avian-visitors-app-init:web-deploy
            ghcr.io/${{ github.repository_owner }}/avian-visitors-app-init:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=avian-app-init
          cache-to: type=gha,mode=max,scope=avian-app-init

      - name: Build and publish PHP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platforms/split-web-host/docker/php.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/avian-visitors-php:web-deploy
            ghcr.io/${{ github.repository_owner }}/avian-visitors-php:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=avian-php
          cache-to: type=gha,mode=max,scope=avian-php

      - name: Build and publish web server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platforms/split-web-host/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/avian-visitors-web:web-deploy
            ghcr.io/${{ github.repository_owner }}/avian-visitors-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=avian-web
          cache-to: type=gha,mode=max,scope=avian-web

      - name: Build and publish worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platforms/split-web-host/docker/worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/avian-visitors-worker:web-deploy
            ghcr.io/${{ github.repository_owner }}/avian-visitors-worker:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=avian-worker
          cache-to: type=gha,mode=max,scope=avian-worker

  publish-deploy-branch:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble minimal Portainer checkout
        run: |
          mkdir -p deploy/platforms/split-web-host/docker
          cp -a avian deploy/avian
          cp -a platforms/split-web-host/docker/. deploy/platforms/split-web-host/docker/
          cp portainer-compose.yaml deploy/
          cp LICENSE deploy/
          printf '%s\n' "${GITHUB_SHA}" > deploy/SOURCE_COMMIT

      - name: Force-update the deployment branch
        working-directory: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -b web-deploy
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Web deploy from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin web-deploy
